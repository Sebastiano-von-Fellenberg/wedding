<script id="site-content" type="application/json">{"languages": {"en": {"brand": "Our wedding", "skip": "Skip to content", "menu": "Menu", "language": "Language", "footer": "Let\u2019s celebrate a little.", "nav": {"home": "Home", "schedule": "Schedule", "travel": "Travel guide", "faq": "FAQ", "rsvp": "RSVP"}, "travel": {"itineraries": "Itineraries", "sitia": "Sitia region", "east": "Eastern Crete", "west": "Western Crete", "south": "Southern Crete", "food": "Food and Drink", "practical": "Practical info"}, "hero": {"eyebrow": "CRETE \u00b7 GREECE", "line1": "Together,", "line2": "by the sea.", "intro": "We\u2019re bringing our favourite people together for a celebration in Crete. Here\u2019s everything you\u2019ll need for the journey.", "explore": "Explore the island", "invitation": "Your invitation", "date_label": "Date", "date": "29 May 2027", "place_label": "Place", "place": "Fotis Seaside \u00b7 Chiona, Crete"}, "home": {"title": "A wedding weekend in eastern Crete.", "intro": "29 May 2027, with a welcome evening in Sitia on 28 May.", "schedule_title": "The celebration", "schedule_desc": "The order of events, from our first gathering to the last dance.", "travel_title": "The journey", "travel_desc": "Make a holiday of it. Discover the different corners of Crete.", "faq_title": "The little details", "faq_desc": "Answers to the questions that help everything feel easy."}, "schedule": {"eyebrow": "Our time together", "title": "The schedule", "intro": "Join us for a warm-up in Sitia on Friday, followed by our wedding by the sea on Saturday. Exact times and the warm-up venue will follow.", "welcome_meta": "Friday \u00b7 28 May 2027 \u00b7 Sitia", "welcome_title": "Warm-up in Sitia", "welcome_desc": "An informal get-together in Sitia to welcome everyone and begin the weekend. The exact venue and time are still to be confirmed.", "wedding_meta": "Saturday \u00b7 29 May 2027 \u00b7 Chiona", "wedding_title": "Wedding celebration", "wedding_desc": "Our wedding celebration at Fotis Seaside on Chiona Beach, with the ceremony, dinner and dancing. Exact timings will follow.", "goodbye_meta": "Details to follow", "goodbye_title": "A slow goodbye", "goodbye_desc": "One more moment together before everyone heads home.", "pending": "Details to follow"}, "guide": {"eyebrow": "Make a little adventure of it", "title": "The travel guide", "intro": "A place for the routes, recommendations and practical details that will help you plan your time in Crete.", "note": "Choose a region or a topic below. We\u2019ll add our personal recommendations as the plans take shape.", "explore": "Explore", "pending": "Recommendations coming soon"}, "faq": {"eyebrow": "The little details", "title": "Frequently asked questions", "intro": "We\u2019ll keep this page updated as the wedding plans come together."}, "questions": [{"section": "Timeline", "q": "When is the RSVP deadline?", "a": "Please fill in the RSVP form by 1 April 2027 if you are planning to attend."}, {"q": "When should I arrive in Crete?", "a": "We recommend arriving in Crete no later than Friday and being in the Sitia region by Saturday morning."}, {"q": "Are there other planned activities apart from the wedding?", "a": "At the moment, we plan on hosting a welcome evening with drinks and snacks on the Friday before the wedding. More details will be posted at a later time."}, {"q": "Change of plans: what if I RSVP\u2019d but can\u2019t make it?", "a": "If you can\u2019t attend but have RSVP\u2019d yes, please let us know as soon as your plans change."}, {"section": "Travel and accommodation", "q": "Where is the wedding?", "a": "The wedding will take place at a seaside restaurant on the east coast of Crete in the Lasithi region. The location might look like it\u2019s in the middle of nowhere, but it\u2019s actually only 25 minutes by car from Oksana\u2019s hometown, Sitia. There are tourist accommodations scattered within walking distance of the restaurant, and the nearest village, Palekastro, has shops, caf\u00e9s, restaurants and other amenities."}, {"q": "What is the best airport to use?", "a": "Crete has three international airports. Heraklion Airport (HER) is the biggest, has numerous international flights, is well connected to the rest of the island and is only two hours from Sitia. Chania Airport (CHQ) is on the opposite side of the island from the wedding location, so it is not recommended. Sitia Airport (JSH) has very few international flights but frequent connections to Athens, so it would be the best option if you are not staying long and find a flight connection that works for you. You can find more information about travel distances and getting around the island in the Travel guide."}, {"q": "When should I book my accommodation?", "a": "Whenever you want. Sitia is not a tourist hotspot, so accommodations aren\u2019t usually booked out, especially at the beginning of the summer season. If you want a wide choice, consider booking two to three months in advance or as soon as you book your flights. Most places will offer free cancellation. For recommendations, take a look at the Travel guide."}, {"q": "Do I need to rent a car?", "a": "If you are travelling alone or staying for fewer than four days, a car is not necessary. If you plan on staying longer, visiting different locations or travelling in a group, a car will make your trip easier and cheaper. A tip from a local: get the smallest car you can fit in."}, {"q": "What will the weather be like?", "a": "The weather in May is usually mild and pleasant. During the day it is warm, but the evening can still be a little chilly. The sea is still cool but comfortable enough for swimming."}, {"q": "I plan to make a vacation out of this. Do you have any tips?", "a": "Of course! You can find all our tips in the Travel guide at the top of the webpage."}, {"section": "Wedding day", "q": "How do I get to the wedding?", "a": "We will organise transportation to and from the venue for all guests who request it. This will involve set departure times and potentially a little walking, depending on where your accommodation is. If you plan on getting there independently, you can drive, take a taxi or walk, depending on where you are staying. Please let us know your preference in the RSVP form."}, {"q": "Is everything in the same location?", "a": "Yes. The ceremony and the party will all take place in one location."}, {"q": "Is there parking at the venue?", "a": "Yes."}, {"q": "When should I arrive at the venue?", "a": "If you are arriving by your own means, please be at the restaurant at 17:00. We have allowed enough time for you to settle in before our ring ceremony starts. If you arrive late and the ceremony has already started, please follow the staff\u2019s instructions."}, {"q": "Is the wedding indoors or outdoors?", "a": "Everything will take place outdoors."}, {"q": "What should I wear?", "a": "Whatever will make you feel comfortable and ready to party. If you need some keywords: Mediterranean seaside. Suits can stay in the closet. A light jacket to cover your shoulders from the evening sea breeze is advised."}, {"q": "Are there any wedding traditions I need to know?", "a": "Not at the moment. We will provide all the information you need at the right time."}, {"q": "What time does the party end?", "a": "There is no end time to parties in Crete."}, {"q": "Are there chairs for small children?", "a": "The restaurant has 2 highchairs. Children under two are not included in our seating plan. Please let us know in the RSVP form if you need an assigned seat next to you for your young child."}, {"section": "General", "q": "Do I need to learn Greek to attend the wedding?", "a": "No, but it would be impressive if you did! Our wedding will be in Greek and German. The staff speaks English."}, {"q": "What if I want to give you something?", "a": "That is so nice of you! A monetary gift is the easiest to fit in our carry-on luggage."}, {"q": "How did you actually meet?", "a": "\u201cShe just moved in with me.\u201d \u2014 Sebastiano"}, {"q": "I have more questions. What do I do?", "a": "You can contact either of us through the usual channels."}], "rsvp": {"private": "PRIVATE RSVP", "title": "Will you join us?", "intro": "We\u2019d love to know whether you can make it. One response covers your entire invitation.", "invited": "INVITED HOUSEHOLD", "limit": "Your invitation is for up to", "people": "people in total.", "deadline": "Please reply by", "attendance": "Will your party attend?", "primary_guest": "You", "partner": "Partner", "add_partner": "Add partner", "children": "Children", "child": "Child", "name": "Name and surname", "menu_preference": "Menu preference", "menu_standard": "Standard", "menu_vegetarian": "Vegetarian", "menu_bring_own": "Bring your own", "allergies": "Allergies", "age": "Age", "assigned_seating": "Assigned seating", "yes_short": "Yes", "no_short": "No", "transportation": "Transportation on the wedding day", "transport_own": "I\u2019ll get there on my own", "transport_help": "I need help getting there", "accommodation": "Accommodation for the wedding weekend", "accommodation_own": "I\u2019ll organize my own", "accommodation_updates": "Let me know about room blocks or special arrangements", "household": "Your name or household", "yes": "Yes, we\u2019ll be there", "no": "Sorry, we can\u2019t make it", "adults_count": "Adults attending", "children_count": "Children attending", "guest_names": "Guest names", "email": "Contact email", "phone": "Phone number", "arrival_date": "Arrival date", "departure_date": "Departure date", "dietary": "Dietary requirements", "message": "Anything else you want to tell us", "optional": "Optional", "count_hint": "Include yourself among the adults.", "names_hint": "One name per line, including yourself.", "privacy": "Your response is visible only to the wedding organisers.", "submit": "Save our response", "saved": "Thank you! Your response has been saved. You can return to update it.", "back": "Back to the wedding website", "logout": "Close this response", "closed": "The RSVP deadline has passed. Please contact the wedding organisers if your plans have changed.", "invalid_invite": "We couldn\u2019t open this response. Please return to the RSVP page and enter the shared password.", "session_error": "Your session could not be verified. Reload the page and try again.", "fix_errors": "Please check the highlighted fields.", "required": "Please select an answer.", "invalid": "Please enter a valid value.", "too_long": "Please shorten this answer.", "count_error": "Please enter at least one adult and no more than {max} people in total.", "date_error": "The departure date must be on or after the arrival date.", "entry_title": "Your place at the table", "entry_intro": "Enter the shared password from your invitation to open the RSVP form.", "entry_label": "Shared password", "password_label": "Password", "entry_button": "Open RSVP", "offline": "The RSVP service isn\u2019t available right now. Please try again later.", "bad_code": "Please enter the shared password.", "bad_password": "That password is not correct. Please try again.", "loading": "Opening RSVP\u2026", "unconfigured": "RSVP will open once the private service is ready.", "entry_note": "The password is printed on your invitation. Your response stays private."}, "travel_pages": {"itineraries": {"intro": "A place for suggested routes and trip lengths.", "sections": []}, "sitia": {"intro": "Our local guide to Sitia and the surrounding area.", "sections": []}, "east": {"intro": "Ideas for exploring the eastern side of the island.", "sections": []}, "west": {"intro": "Ideas for extending your trip to western Crete.", "sections": []}, "south": {"intro": "Ideas for spending time on the southern coast.", "sections": []}, "food": {"intro": "The wedding venue and places to eat and drink around eastern Crete.", "sections": [{"title": "Fotis Seaside \u00b7 our wedding venue", "paragraphs": ["Our wedding celebration takes place at Fotis Seaside on Chiona Beach on Saturday, 29 May 2027.", "Fotis Seaside is a restaurant, caf\u00e9 and bar directly by the sea near Palekastro. Its kitchen focuses on fresh seafood sourced from local fishermen, alongside Cretan and Mediterranean dishes, meat, salads, desserts and a curated wine list. The venue also serves coffee, cocktails and snacks by the beach.", "The precise wedding schedule and guest arrangements will be shared separately; the restaurant\u2019s ordinary opening hours and public menu are not the wedding timetable or wedding menu."], "links": [{"label": "Fotis Seaside", "description": "Official restaurant website", "url": "https://fotis-seaside.com/"}, {"label": "Open in Google Maps", "description": "Chiona Beach \u00b7 35.1992673, 26.2769463", "url": "https://www.google.com/maps/search/?api=1\u0026query=35.1992673%2C26.2769463"}]}]}, "practical": {"intro": "Accommodation, transport and useful details for your visit.", "sections": [{"title": "Where to stay", "paragraphs": ["For the shortest journey to the wedding venue, start your search around Palekastro, Chiona and Kouremenos. Sitia has a larger selection and is convenient for Friday\u2019s warm-up, but it is farther from Fotis Seaside, so plan transport for Saturday.", "These are independent suggestions, not reserved room blocks. Check current location, cancellation terms, accessibility, transport and availability directly with each property before booking."], "links": [{"label": "Castri Village Hotel", "description": "Studios and apartments above Kouremenos Beach; pool and panoramic views", "url": "https://castrivillagehotel.gr/"}, {"label": "Hiona Holiday Hotel", "description": "Small hotel in Palekastro with rooms, family accommodation and a pool", "url": "https://www.hionaholiday.gr/"}, {"label": "AKRA Hospitality", "description": "Apartments, villas and studios around Kouremenos and Chiona", "url": "https://akrahospitality.gr/"}, {"label": "Porto Heli Apartments", "description": "Apartments near Palekastro and Kouremenos Beach", "url": "https://www.porto-heli-crete.gr/"}, {"label": "Airbnb \u00b7 Palekastro", "description": "Area search for houses, apartments and villas; listings and prices change", "url": "https://www.airbnb.com/palekastro-greece/stays"}, {"label": "Sitia Hotels Association", "description": "Directory of hotels across the wider Sitia region", "url": "https://www.sitiahotels.gr/en/hotels/"}]}]}}}, "de": {"brand": "Unsere Hochzeit", "skip": "Zum Inhalt springen", "menu": "Men\u00fc", "language": "Sprache", "footer": "Lasst uns ein bisschen feiern.", "nav": {"home": "Startseite", "schedule": "Zeitplan", "travel": "Reisef\u00fchrer", "faq": "FAQ", "rsvp": "Reservieren"}, "travel": {"itineraries": "Reiserouten", "sitia": "Region Sitia", "east": "Ostkreta", "west": "Westkreta", "south": "S\u00fcdkreta", "food": "Essen \u0026 Trinken", "practical": "Praktische Informationen"}, "hero": {"eyebrow": "KRETA \u00b7 GRIECHENLAND", "line1": "Zusammen.", "line2": "Am Meer.", "intro": "Wir bringen unsere Lieblingsmenschen f\u00fcr ein Fest auf Kreta zusammen. Hier findet ihr alles f\u00fcr eure Reise.", "explore": "Die Insel entdecken", "invitation": "Eure Einladung", "date_label": "Datum", "date": "29. Mai 2027", "place_label": "Ort", "place": "Fotis Seaside \u00b7 Chiona, Kreta"}, "home": {"title": "Ein Hochzeitswochenende im Osten Kretas.", "intro": "29. Mai 2027, mit einem Willkommensabend am 28. Mai in Sitia.", "schedule_title": "Das Fest", "schedule_desc": "Der Ablauf, vom ersten Treffen bis zum letzten Tanz.", "travel_title": "Die Reise", "travel_desc": "Macht einen Urlaub daraus und entdeckt die verschiedenen Seiten Kretas.", "faq_title": "Die kleinen Details", "faq_desc": "Antworten auf die Fragen, die eure Planung leichter machen."}, "schedule": {"eyebrow": "Unsere gemeinsame Zeit", "title": "Der Zeitplan", "intro": "Am Freitag treffen wir uns zum entspannten Auftakt in Sitia, am Samstag feiern wir unsere Hochzeit am Meer. Die genauen Uhrzeiten und der Ort f\u00fcr Freitag folgen.", "welcome_meta": "Freitag \u00b7 28. Mai 2027 \u00b7 Sitia", "welcome_title": "Auftakt in Sitia", "welcome_desc": "Ein ungezwungenes Treffen in Sitia, um gemeinsam ins Hochzeitswochenende zu starten. Der genaue Ort und die Uhrzeit stehen noch nicht fest.", "wedding_meta": "Samstag \u00b7 29. Mai 2027 \u00b7 Chiona", "wedding_title": "Hochzeitsfeier", "wedding_desc": "Unsere Hochzeitsfeier im Fotis Seaside am Strand von Chiona, mit Trauung, Abendessen und Tanz. Die genauen Uhrzeiten folgen.", "goodbye_meta": "Details folgen", "goodbye_title": "Ein entspannter Abschied", "goodbye_desc": "Noch ein gemeinsamer Moment vor der Heimreise.", "pending": "Details folgen"}, "guide": {"eyebrow": "Zeit f\u00fcr ein kleines Abenteuer", "title": "Der Reisef\u00fchrer", "intro": "Hier sammeln wir Reiserouten, Empfehlungen und praktische Informationen f\u00fcr eure Zeit auf Kreta.", "note": "W\u00e4hlt unten eine Region oder ein Thema. Unsere pers\u00f6nlichen Empfehlungen erg\u00e4nzen wir nach und nach.", "explore": "Entdecken", "pending": "Empfehlungen folgen"}, "faq": {"eyebrow": "Die kleinen Details", "title": "H\u00e4ufig gestellte Fragen", "intro": "Wir aktualisieren diese Seite, sobald weitere Hochzeitsdetails feststehen."}, "questions": [{"section": "Zeitplan", "q": "Bis wann ist die RSVP-Frist?", "a": "Bitte f\u00fclle das Reservierungsformular bis zum 1. April 2027 aus, wenn du planst teilzunehmen."}, {"q": "Wann sollte ich auf Kreta ankommen?", "a": "Wir empfehlen, sp\u00e4testens am Freitag auf Kreta anzukommen und bis Samstagmorgen in der Region Sitia zu sein."}, {"q": "Gibt es neben der Hochzeit weitere geplante Aktivit\u00e4ten?", "a": "Derzeit planen wir am Freitag vor der Hochzeit einen Willkommensabend mit Getr\u00e4nken und kleinen Snacks. Weitere Details folgen zu einem sp\u00e4teren Zeitpunkt."}, {"q": "Plan\u00e4nderung \u2013 was, wenn ich zugesagt habe, aber doch nicht kommen kann?", "a": "Falls du zugesagt hast, aber doch nicht teilnehmen kannst, gib uns bitte so schnell wie m\u00f6glich Bescheid, sobald sich deine Pl\u00e4ne \u00e4ndern."}, {"section": "Anreise und Unterkunft", "q": "Wo findet die Hochzeit statt?", "a": "Die Hochzeit findet in einem Restaurant am Meer an der Ostk\u00fcste Kretas in der Region Lasithi statt. Der Ort wirkt vielleicht etwas abgelegen, ist aber nur etwa 25 Autominuten von Oksanas Heimatstadt Sitia entfernt. In fu\u00dfl\u00e4ufiger Entfernung zum Restaurant gibt es touristische Unterk\u00fcnfte, und das n\u00e4chstgelegene Dorf Paleokastro bietet Gesch\u00e4fte, Caf\u00e9s, Restaurants und weitere Annehmlichkeiten."}, {"q": "Welcher Flughafen ist der beste?", "a": "Kreta hat drei internationale Flugh\u00e4fen. Der Flughafen Heraklion (HER) ist der gr\u00f6\u00dfte, bietet zahlreiche internationale Fl\u00fcge, ist gut an den Rest der Insel angebunden und liegt nur etwa 2 Stunden von Sitia entfernt. Der Flughafen Chania (CHQ) liegt auf der gegen\u00fcberliegenden Seite der Insel und ist daher nicht zu empfehlen.Der Flughafen Sitia (JSH) hat sehr wenige internationale Fl\u00fcge, daf\u00fcr aber h\u00e4ufige Verbindungen nach Athen \u2013 er ist ideal, wenn du nur kurz bleibst und eine passende Verbindung findest. Weitere Informationen zu Entfernungen und zur Fortbewegung auf der Insel findest du im Tab \u201eReisef\u00fchrer\u201c."}, {"q": "Wann sollte ich meine Unterkunft buchen?", "a": "Wann immer du m\u00f6chtest. Sitia ist kein touristischer Hotspot, daher sind Unterk\u00fcnfte \u2013 besonders im Mai \u2013 meist nicht ausgebucht. Wenn du eine gr\u00f6\u00dfere Auswahl haben m\u00f6chtest, buche am besten 2\u20133 Monate im Voraus oder sobald du deine Fl\u00fcge gebucht hast. Die meisten Unterk\u00fcnfte bieten kostenlose Stornierung an. Empfehlungen findest du im Tab \u201eReisef\u00fchrer\u201c."}, {"q": "Brauche ich einen Mietwagen?", "a": "Wenn du alleine reist oder weniger als 4 Tage bleibst, ist ein Auto nicht unbedingt notwendig. Planst du einen l\u00e4ngeren Aufenthalt, m\u00f6chtest verschiedene Orte besuchen oder reist du in einer Gruppe, macht ein Mietwagen die Reise einfacher und g\u00fcnstiger.\nTipp von Einheimischen: Nimm das kleinste Auto, in das du reinpasst."}, {"q": "Wie wird das Wetter sein?", "a": "Das Wetter im Mai ist normalerweise mild und angenehm. Tags\u00fcber ist es warm, aber abends kann es noch etwas k\u00fchl sein. Das Meer ist noch frisch, aber angenehm genug zum Schwimmen."}, {"q": "Ich m\u00f6chte daraus einen Urlaub machen. Habt ihr Tipps?", "a": "Nat\u00fcrlich! Alle Tipps findest du im Tab \u201eReisef\u00fchrer\u201c oben auf der Webseite."}, {"section": "Hochzeitstag", "q": "Wie komme ich zur Hochzeit?", "a": "Wir organisieren f\u00fcr alle G\u00e4ste, die es w\u00fcnschen, einen Transport zum und vom Veranstaltungsort. Dieser erfolgt zu festgelegten Abfahrtszeiten und kann \u2013 je nach Unterkunft \u2013 einen kurzen Fu\u00dfweg beinhalten.\nWenn du selbst anreisen m\u00f6chtest, kannst du je nach Lage mit dem Auto fahren, ein Taxi nehmen oder zu Fu\u00df gehen. Bitte gib deine Pr\u00e4ferenz im Reservierungsformular an."}, {"q": "Findet alles am selben Ort statt?", "a": "Ja. Die Zeremonie und die Feier finden am selben Ort statt."}, {"q": "Gibt es Parkm\u00f6glichkeiten vor Ort?", "a": "Ja."}, {"q": "Wann sollte ich am Veranstaltungsort sein?", "a": "Wenn du selbst anreist, sei bitte um 17:00 Uhr im Restaurant. Wir haben ausreichend Zeit eingeplant, damit du dich vor Beginn unserer Ringzeremonie einrichten kannst. Solltest du sp\u00e4ter ankommen und die Zeremonie bereits begonnen haben, folge bitte den Anweisungen des Personals."}, {"q": "Findet die Hochzeit drinnen oder drau\u00dfen statt?", "a": "Alles findet im Freien statt."}, {"q": "Was soll ich anziehen?", "a": "Alles, worin du dich wohlf\u00fchlst und bereit zum Feiern bist. Als Stichwort: \u201eMittelmeerk\u00fcste\". Anz\u00fcge k\u00f6nnen im Schrank bleiben. Eine leichte Jacke f\u00fcr die k\u00fchle Meeresbrise am Abend wird empfohlen."}, {"q": "Gibt es Hochzeitstraditionen, die ich kennen sollte?", "a": "Im Moment nicht. Wir geben dir alle n\u00f6tigen Informationen zur richtigen Zeitpunkt."}, {"q": "Wann endet die Feier?", "a": "Partys auf Kreta haben keinen Endzeitpunkt."}, {"q": "Gibt es St\u00fchle f\u00fcr kleine Kinder?", "a": "Das Restaurant verf\u00fcgt \u00fcber 2 Hochst\u00fchle. Kinder unter 2 Jahren sind nicht in unserem Sitzplan enthalten. Bitte gib im Reservierungsformular an, falls du einen festen Sitzplatz neben dir f\u00fcr dein kleines Kind ben\u00f6tigst."}, {"section": "Allgemeines", "q": "Muss ich Griechisch lernen, um an der Hochzeit teilzunehmen?", "a": "Nein, aber es w\u00e4re beeindruckend! Unsere Hochzeit wird auf Deutsch und Griechisch stattfinden. Das Personal spricht Englisch."}, {"q": "Was, wenn ich euch etwas schenken m\u00f6chte?", "a": "Das ist sehr lieb! Ein Geldgeschenk l\u00e4sst sich am einfachsten in unserem Handgep\u00e4ck verstauen."}, {"q": "Wie habt ihr euch eigentlich kennengelernt?", "a": "\u201eSie ist einfach bei mir eingezogen.\u201c \u2013 Sebastiano"}, {"q": "Ich habe noch mehr Fragen. Was soll ich tun?", "a": "Du kannst uns beide jederzeit \u00fcber die \u00fcblichen Kan\u00e4le kontaktieren."}], "rsvp": {"private": "PRIVATE R\u00dcCKMELDUNG", "title": "Seid ihr dabei?", "intro": "Wir freuen uns auf eure R\u00fcckmeldung. Eine Antwort gilt f\u00fcr eure gesamte Einladung.", "invited": "EINGELADENER HAUSHALT", "limit": "Eure Einladung gilt f\u00fcr bis zu", "people": "Personen insgesamt.", "deadline": "Bitte antwortet bis zum", "attendance": "Werdet ihr teilnehmen?", "primary_guest": "Du / Ihr", "partner": "Partner oder Partnerin", "add_partner": "Partner oder Partnerin hinzuf\u00fcgen", "children": "Kinder", "child": "Kind", "name": "Vor- und Nachname", "menu_preference": "Men\u00fcwunsch", "menu_standard": "Standard", "menu_vegetarian": "Vegetarisch", "menu_bring_own": "Eigenes Essen mitbringen", "a u03b4\u03b9\u03b1\u03b4\u03c1\u03bf\u03bc\u03ad\u03c2, \u03c0\u03c1\u03bf\u03c4\u03ac\u03c3\u03b5\u03b9\u03c2 \u03ba\u03b1\u03b9 \u03c0\u03c1\u03b1\u03ba\u03c4\u03b9\u03ba\u03ad\u03c2 \u03c0\u03bb\u03b7\u03c1\u03bf\u03c6\u03bf\u03c1\u03af\u03b5\u03c2 \u03b3\u03b9\u03b1 \u03c4\u03b7\u03bd \u03c0\u03b1\u03c1\u03b1\u03bc\u03bf\u03bd\u03ae \u03c3\u03b1\u03c2 \u03c3\u03c4\u03b7\u03bd \u039a\u03c1\u03ae\u03c4\u03b7.", "note": "\u0395\u03c0\u03b9\u03bb\u03ad\u03be\u03c4\u03b5 \u03bc\u03b9\u03b1 \u03c0\u03b5\u03c1\u03b9\u03bf\u03c7\u03ae \u03ae \u03ad\u03bd\u03b1 \u03b8\u03ad\u03bc\u03b1 \u03c0\u03b1\u03c1\u03b1\u03ba\u03ac\u03c4\u03c9. \u0398\u03b1 \u03c0\u03c1\u03bf\u03c3\u03b8\u03ad\u03c4\u03bf\u03c5\u03bc\u03b5 \u03c4\u03b9\u03c2 \u03c0\u03c1\u03bf\u03c3\u03c9\u03c0\u03b9\u03ba\u03ad\u03c2 \u03bc\u03b1\u03c2 \u03c0\u03c1\u03bf\u03c4\u03ac\u03c3\u03b5\u03b9\u03c2 \u03c3\u03c4\u03b1\u03b4\u03b9\u03b1\u03ba\u03ac.", "explore": "\u0391\u03bd\u03b1\u03ba\u03b1\u03bb\u03cd\u03c8\u03c4\u03b5", "pending": "\u039f\u03b9 \u03c0\u03c1\u03bf\u03c4\u03ac\u03c3\u03b5\u03b9\u03c2 \u03b8\u03b1 \u03c0\u03c1\u03bf\u03c3\u03c4\u03b5\u03b8\u03bf\u03cd\u03bd \u03c3\u03cd\u03bd\u03c4\u03bf\u03bc\u03b1"}, "faq": {"eyebrow": "\u039f\u03b9 \u03bc\u03b9\u03ba\u03c1\u03ad\u03c2 \u03bb\u03b5\u03c0\u03c4\u03bf\u03bc\u03ad\u03c1\u03b5\u03b9\u03b5\u03c2", "title": "\u03a3\u03c5\u03c7\u03bd\u03ad\u03c2 \u03b5\u03c1\u03c9\u03c4\u03ae\u03c3\u03b5\u03b9\u03c2", "intro": "\u0398\u03b1 \u03b5\u03bd\u03b7\u03bc\u03b5\u03c1\u03ce\u03bd\u03bf\u03c5\u03bc\u03b5 \u03b1\u03c5\u03c4\u03ae \u03c4\u03b7 \u03c3\u03b5\u03bb\u03af\u03b4\u03b1 \u03ba\u03b1\u03b8\u03ce\u03c2 \u03bf\u03c1\u03b9\u03c3\u03c4\u03b9\u03ba\u03bf\u03c0\u03bf\u03b9\u03bf\u03cd\u03bd\u03c4\u03b1\u03b9 \u03bf\u03b9 \u03bb\u03b5\u03c0\u03c4\u03bf\u03bc\u03ad\u03c1\u03b5\u03b9\u03b5\u03c2 \u03c4\u03bf\u03c5 \u03b3\u03ac\u03bc\u03bf\u03c5."}, "questions": [{"section": "\u03a7\u03c1\u03bf\u03bd\u03bf\u03b4\u03b9\u03ac\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1", "q": "\u03a0\u03cc\u03c4\u03b5 \u03b5\u03af\u03bd\u03b1\u03b9 \u03b7 \u03c0\u03c1\u03bf\u03b8\u03b5\u03c3\u03bc\u03af\u03b1 \u03b3\u03b9\u03b1 \u03c4\u03bf RSVP;", "a": "\u03a0\u03b1\u03c1\u03b1\u03ba\u03b1\u03bb\u03ce \u03c3\u03c5\u03bc\u03c0\u03bb\u03ae\u03c1\u03c9\u03c3\u03b5 \u03c4\u03b7 \u03c6\u03cc\u03c1\u03bc\u03b1 RSVP \u03ad\u03c9\u03c2 \u03c4\u03b9\u03c2 1 \u0391\u03c0\u03c1\u03b9\u03bb\u03af\u03bf\u03c5 2027, \u03b1\u03bd \u03c3\u03ba\u03bf\u03c0\u03b5\u03cd\u03b5\u03b9\u03c2 \u03bd\u03b1 \u03c0\u03b1\u03c1\u03b5\u03c5\u03c1\u03b5\u03b8\u03b5\u03af\u03c2."}, {"q": "\u03a0\u03cc\u03c4\u03b5 \u03c0\u03c1\u03ad\u03c0\u03b5\u03b9 \u03bd\u03b1 \u03c6\u03c4\u03ac\u03c3\u03c9 \u03c3\u03c4\u03b7\u03bd \u039a\u03c1\u03ae\u03c4\u03b7;", "a": "\u03a0\u03c1\u03bf\u03c4\u03b5\u03af\u03bd\u03bf\u03c5\u03bc\u03b5 \u03bd\u03b1 \u03c6\u03c4\u03ac\u03c3\u03b5\u03b9\u03c2 \u03c3\u03c4\u03b7\u03bd \u039a\u03c1\u03ae\u03c4\u03b7 \u03c4\u03bf \u03b1\u03c1\u03b3\u03cc\u03c4\u03b5\u03c1\u03bf \u03c4\u03b7\u03bd \u03a0\u03b1\u03c1\u03b1\u03c3\u03ba\u03b5\u03c5\u03ae \u03ba\u03b1\u03b9 \u03bd\u03b1 \u03b2\u03c1\u03af\u03c3\u03ba\u03b5\u03c3\u03b1\u03b9 \u03c3\u03c4\u03b7\u03bd \u03c0\u03b5\u03c1\u03b9\u03bf\u03c7\u03ae \u03c4\u03b7\u03c2 \u03a3\u03b7\u03c4\u03b5\u03af\u03b1\u03c2 \u03ad\u03c9\u03c2 \u03c4\u03bf \u03c0\u03c1\u03c9\u03af \u03c4\u03bf\u03c5 \u03a3\u03b1\u03b2\u03b2\u03ac\u03c4\u03bf\u03c5."}, {"q": "\u03a5\u03c0\u03ac\u03c1\u03c7\u03bf\u03c5\u03bd \u03ac\u03bb\u03bb\u03b5\u03c2 \u03c0\u03c1\u03bf\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1\u03c4\u03b9\u03c3\u03bc\u03ad\u03bd\u03b5\u03c2 \u03b4\u03c1\u03b1\u03c3\u03c4\u03b7\u03c1\u03b9\u03cc\u03c4\u03b7\u03c4\u03b5\u03c2 \u03b5\u03ba\u03c4\u03cc\u03c2 \u03b1\u03c0\u03cc \u03c4\u03bf\u03bd \u03b3\u03ac\u03bc\u03bf;", "a": "\u03a0\u03c1\u03bf\u03c2 \u03c4\u03bf \u03c0\u03b1\u03c1\u03cc\u03bd \u03c3\u03c7\u03b5\u03b4\u03b9\u03ac\u03b6\u03bf\u03c5\u03bc\u03b5 \u03bd\u03b1 \u03b4\u03b9\u03bf\u03c1\u03b3\u03b1\u03bd\u03ce\u03c3\u03bf\u03c5\u03bc\u03b5 \u03ad\u03bd\u03b1 \u03b2\u03c1\u03ac\u03b4\u03c5 \u03ba\u03b1\u03bb\u03c9\u03c3\u03bf\u03c1\u03af\u03c3\u03bc\u03b1\u03c4\u03bf\u03c2 \u03bc\u03b5 \u03c0\u03bf\u03c4\u03ac \u03ba\u03b1\u03b9 \u03c3\u03bd\u03b1\u03ba \u03c4\u03b7\u03bd \u03a0\u03b1\u03c1\u03b1\u03c3\u03ba\u03b5\u03c5\u03ae \u03c0\u03c1\u03b9\u03bd \u03b1\u03c0\u03cc \u03c4\u03bf\u03bd \u03b3\u03ac\u03bc\u03bf. \u03a0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03bb\u03b5\u03c0\u03c4\u03bf\u03bc\u03ad\u03c1\u03b5\u03b9\u03b5\u03c2 \u03b8\u03b1 \u03b1\u03bd\u03b1\u03ba\u03bf\u03b9\u03bd\u03c9\u03b8\u03bf\u03cd\u03bd \u03b1\u03c1\u03b3\u03cc\u03c4\u03b5\u03c1\u03b1."}, {"q": "\u0391\u03bb\u03bb\u03b1\u03b3\u03ae \u03c3\u03c7\u03b5\u03b4\u03af\u03c9\u03bd \u2013 \u03c4\u03b9 \u03b3\u03af\u03bd\u03b5\u03c4\u03b1\u03b9 \u03b1\u03bd \u03ad\u03c7\u03c9 \u03b1\u03c0\u03b1\u03bd\u03c4\u03ae\u03c3\u03b5\u03b9 \u03c3\u03c4\u03bf RSVP \u03b1\u03bb\u03bb\u03ac \u03b4\u03b5\u03bd \u03bc\u03c0\u03bf\u03c1\u03ce \u03bd\u03b1 \u03ad\u03c1\u03b8\u03c9;", "a": "\u0391\u03bd \u03b4\u03b5\u03bd \u03bc\u03c0\u03bf\u03c1\u03b5\u03af\u03c2 \u03bd\u03b1 \u03c0\u03b1\u03c1\u03b5\u03c5\u03c1\u03b5\u03b8\u03b5\u03af\u03c2 \u03b5\u03bd\u03ce \u03ad\u03c7\u03b5\u03b9\u03c2 \u03b1\u03c0\u03b1\u03bd\u03c4\u03ae\u03c3\u03b5\u03b9 \u03b8\u03b5\u03c4\u03b9\u03ba\u03ac, \u03c0\u03b1\u03c1\u03b1\u03ba\u03b1\u03bb\u03bf\u03cd\u03bc\u03b5 \u03b5\u03bd\u03b7\u03bc\u03ad\u03c1\u03c9\u03c3\u03ad \u03bc\u03b1\u03c2 \u03c4\u03bf \u03c3\u03c5\u03bd\u03c4\u03bf\u03bc\u03cc\u03c4\u03b5\u03c1\u03bf \u03b4\u03c5\u03bd\u03b1\u03c4\u03cc \u03bc\u03cc\u03bb\u03b9\u03c2 \u03b1\u03bb\u03bb\u03ac\u03be\u03bf\u03c5\u03bd \u03c4\u03b1 \u03c3\u03c7\u03ad\u03b4\u03b9\u03ac \u03c3\u03bf\u03c5."}, {"section": "\u039c\u03b5\u03c4\u03b1\u03ba\u03af\u03bd\u03b7\u03c3\u03b7 \u03ba\u03b1\u03b9 \u03b4\u03b9\u03b1\u03bc\u03bf\u03bd\u03ae", "q": "\u03a0\u03bf\u03cd \u03b8\u03b1 \u03b3\u03af\u03bd\u03b5\u03b9 \u03bf \u03b3\u03ac\u03bc\u03bf\u03c2;", "a": "\u039f \u03b3\u03ac\u03bc\u03bf\u03c2 \u03b8\u03b1 \u03c0\u03c1\u03b1\u03b3\u03bc\u03b1\u03c4\u03bf\u03c0\u03bf\u03b9\u03b7\u03b8\u03b5\u03af \u03c3\u03b5 \u03c0\u03b1\u03c1\u03b1\u03b8\u03b1\u03bb\u03ac\u03c3\u03c3\u03b9\u03bf \u03b5\u03c3\u03c4\u03b9\u03b1\u03c4\u03cc\u03c1\u03b9\u03bf \u03c3\u03c4\u03b7\u03bd \u03b1\u03bd\u03b1\u03c4\u03bf\u03bb\u03b9\u03ba\u03ae \u03b1\u03ba\u03c4\u03ae \u03c4\u03b7\u03c2 \u039a\u03c1\u03ae\u03c4\u03b7\u03c2. \u0397 \u03c4\u03bf\u03c0\u03bf\u03b8\u03b5\u03c3\u03af\u03b1 \u03bc\u03c0\u03bf\u03c1\u03b5\u03af \u03bd\u03b1 \u03c6\u03b1\u03af\u03bd\u03b5\u03c4\u03b1\u03b9 \u03b1\u03c0\u03bf\u03bc\u03bf\u03bd\u03c9\u03bc\u03ad\u03bd\u03b7, \u03b1\u03bb\u03bb\u03ac \u03b1\u03c0\u03ad\u03c7\u03b5\u03b9 \u03bc\u03cc\u03bb\u03b9\u03c2 25 \u03bb\u03b5\u03c0\u03c4\u03ac \u03bc\u03b5 \u03c4\u03bf \u03b1\u03c5\u03c4\u03bf\u03ba\u03af\u03bd\u03b7\u03c4\u03bf \u03b1\u03c0\u03cc \u03c4\u03b7 \u03a3\u03b7\u03c4\u03b5\u03af\u03b1. \u03a5\u03c0\u03ac\u03c1\u03c7\u03bf\u03c5\u03bd \u03c4\u03bf\u03c5\u03c1\u03b9\u03c3\u03c4\u03b9\u03ba\u03ac \u03ba\u03b1\u03c4\u03b1\u03bb\u03cd\u03bc\u03b1\u03c4\u03b1 \u03c3\u03b5 \u03ba\u03bf\u03bd\u03c4\u03b9\u03bd\u03ae \u03b1\u03c0\u03cc\u03c3\u03c4\u03b1\u03c3\u03b7 \u03b1\u03c0\u03cc \u03c4\u03bf \u03b5\u03c3\u03c4\u03b9\u03b1\u03c4\u03cc\u03c1\u03b9\u03bf, \u03b5\u03bd\u03ce \u03c4\u03bf \u03ba\u03bf\u03bd\u03c4\u03b9\u03bd\u03cc\u03c4\u03b5\u03c1\u03bf \u03c7\u03c9\u03c1\u03b9\u03cc, \u03c4\u03bf \u03a0\u03b1\u03bb\u03b1\u03b9\u03cc\u03ba\u03b1\u03c3\u03c4\u03c1\u03bf, \u03b4\u03b9\u03b1\u03b8\u03ad\u03c4\u03b5\u03b9 \u03ba\u03b1\u03c4\u03b1\u03c3\u03c4\u03ae\u03bc\u03b1\u03c4\u03b1, \u03ba\u03b1\u03c6\u03ad, \u03b5\u03c3\u03c4\u03b9\u03b1\u03c4\u03cc\u03c1\u03b9\u03b1 \u03ba\u03b1\u03b9 \u03ac\u03bb\u03bb\u03b5\u03c2 \u03c0\u03b1\u03c1\u03bf\u03c7\u03ad\u03c2."}, {"q": "\u03a0\u03cc\u03c4\u03b5 \u03c0\u03c1\u03ad\u03c0\u03b5\u03b9 \u03bd\u03b1 \u03ba\u03bb\u03b5\u03af\u03c3\u03c9 \u03c4\u03b7 \u03b4\u03b9\u03b1\u03bc\u03bf\u03bd\u03ae \u03bc\u03bf\u03c5;", "a": "\u038c\u03c0\u03bf\u03c4\u03b5 \u03b8\u03ad\u03bb\u03b5\u03b9\u03c2. \u0397 \u03a3\u03b7\u03c4\u03b5\u03af\u03b1 \u03b4\u03b5\u03bd \u03b5\u03af\u03bd\u03b1\u03b9 \u03c4\u03bf\u03c5\u03c1\u03b9\u03c3\u03c4\u03b9\u03ba\u03cc hotspot, \u03bf\u03c0\u03cc\u03c4\u03b5 \u03c4\u03b1 \u03ba\u03b1\u03c4\u03b1\u03bb\u03cd\u03bc\u03b1\u03c4\u03b1 \u03c3\u03c5\u03bd\u03ae\u03b8\u03c9\u03c2 \u03b4\u03b5\u03bd \u03b5\u03be\u03b1\u03bd\u03c4\u03bb\u03bf\u03cd\u03bd\u03c4\u03b1\u03b9, \u03b5\u03b9\u03b4\u03b9\u03ba\u03ac \u03c4\u03bf\u03bd \u039c\u03ac\u03b9\u03bf. \u0391\u03bd \u03b8\u03ad\u03bb\u03b5\u03b9\u03c2 \u03bc\u03b5\u03b3\u03b1\u03bb\u03cd\u03c4\u03b5\u03c1\u03b7 \u03c0\u03bf\u03b9\u03ba\u03b9\u03bb\u03af\u03b1, \u03c3\u03ba\u03ad\u03c8\u03bf\u03c5 \u03bd\u03b1 \u03ba\u03bb\u03b5\u03af\u03c3\u03b5\u03b9\u03c2 2\u20133 \u03bc\u03ae\u03bd\u03b5\u03c2 \u03bd\u03c9\u03c1\u03af\u03c4\u03b5\u03c1\u03b1 \u03ae \u03bc\u03cc\u03bb\u03b9\u03c2 \u03ba\u03bb\u03b5\u03af\u03c3\u03b5\u03b9\u03c2 \u03c4\u03b9\u03c2 \u03c0\u03c4\u03ae\u03c3\u03b5\u03b9\u03c2 \u03c3\u03bf\u03c5. \u03a4\u03b1 \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03b1 \u03ba\u03b1\u03c4\u03b1\u03bb\u03cd\u03bc\u03b1\u03c4\u03b1 \u03c0\u03c1\u03bf\u03c3\u03c6\u03ad\u03c1\u03bf\u03c5\u03bd \u03b4\u03c9\u03c1\u03b5\u03ac\u03bd \u03b1\u03ba\u03cd\u03c1\u03c9\u03c3\u03b7."}, {"q": "\u03a7\u03c1\u03b5\u03b9\u03ac\u03b6\u03b5\u03c4\u03b1\u03b9 \u03bd\u03b1 \u03bd\u03bf\u03b9\u03ba\u03b9\u03ac\u03c3\u03c9 \u03b1\u03c5\u03c4\u03bf\u03ba\u03af\u03bd\u03b7\u03c4\u03bf;", "a": "\u0391\u03bd \u03c4\u03b1\u03be\u03b9\u03b4\u03b5\u03cd\u03b5\u03b9\u03c2 \u03bc\u03cc\u03bd\u03bf\u03c2/\u03bc\u03cc\u03bd\u03b7 \u03c3\u03bf\u03c5 \u03ae \u03bc\u03ad\u03bd\u03b5\u03b9\u03c2 \u03bb\u03b9\u03b3\u03cc\u03c4\u03b5\u03c1\u03bf \u03b1\u03c0\u03cc 4 \u03b7\u03bc\u03ad\u03c1\u03b5\u03c2, \u03c4\u03bf \u03b1\u03c5\u03c4\u03bf\u03ba\u03af\u03bd\u03b7\u03c4\u03bf \u03b4\u03b5\u03bd \u03b5\u03af\u03bd\u03b1\u03b9 \u03b1\u03c0\u03b1\u03c1\u03b1\u03af\u03c4\u03b7\u03c4\u03bf. \u0391\u03bd \u03c3\u03ba\u03bf\u03c0\u03b5\u03cd\u03b5\u03b9\u03c2 \u03bd\u03b1 \u03bc\u03b5\u03af\u03bd\u03b5\u03b9\u03c2 \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03bf, \u03bd\u03b1 \u03b5\u03c0\u03b9\u03c3\u03ba\u03b5\u03c6\u03b8\u03b5\u03af\u03c2 \u03b4\u03b9\u03b1\u03c6\u03bf\u03c1\u03b5\u03c4\u03b9\u03ba\u03ac \u03bc\u03ad\u03c1\u03b7 \u03ae \u03bd\u03b1 \u03c4\u03b1\u03be\u03b9\u03b4\u03ad\u03c8\u03b5\u03b9\u03c2 \u03c3\u03b5 \u03bf\u03bc\u03ac\u03b4\u03b1, \u03c4\u03bf \u03b1\u03c5\u03c4\u03bf\u03ba\u03af\u03bd\u03b7\u03c4\u03bf \u03b8\u03b1 \u03ba\u03ac\u03bd\u03b5\u03b9 \u03c4\u03bf \u03c4\u03b1\u03be\u03af\u03b4\u03b9 \u03c3\u03bf\u03c5 \u03c0\u03b9\u03bf \u03b5\u03cd\u03ba\u03bf\u03bb\u03bf \u03ba\u03b1\u03b9 \u03c0\u03b9\u03bf \u03bf\u03b9\u03ba\u03bf\u03bd\u03bf\u03bc\u03b9\u03ba\u03cc."}, {"section": "\u0397\u03bc\u03ad\u03c1\u03b1 \u03b3\u03ac\u03bc\u03bf\u03c5", "q": "\u03a0\u03ce\u03c2 \u03b8\u03b1 \u03c6\u03c4\u03ac\u03c3\u03c9 \u03c3\u03c4\u03bf\u03bd \u03b3\u03ac\u03bc\u03bf;", "a": "\u0398\u03b1 \u03bf\u03c1\u03b3\u03b1\u03bd\u03ce\u03c3\u03bf\u03c5\u03bc\u03b5 \u03bc\u03b5\u03c4\u03b1\u03c6\u03bf\u03c1\u03ac \u03c0\u03c1\u03bf\u03c2 \u03ba\u03b1\u03b9 \u03b1\u03c0\u03cc \u03c4\u03bf\u03bd \u03c7\u03ce\u03c1\u03bf \u03b3\u03b9\u03b1 \u03cc\u03bb\u03bf\u03c5\u03c2 \u03c4\u03bf\u03c5\u03c2 \u03ba\u03b1\u03bb\u03b5\u03c3\u03bc\u03ad\u03bd\u03bf\u03c5\u03c2 \u03c0\u03bf\u03c5 \u03c4\u03bf \u03b6\u03b7\u03c4\u03ae\u03c3\u03bf\u03c5\u03bd. \u0398\u03b1 \u03c5\u03c0\u03ac\u03c1\u03c7\u03bf\u03c5\u03bd \u03c3\u03c5\u03b3\u03ba\u03b5\u03ba\u03c1\u03b9\u03bc\u03ad\u03bd\u03b5\u03c2 \u03ce\u03c1\u03b5\u03c2 \u03b1\u03bd\u03b1\u03c7\u03ce\u03c1\u03b7\u03c3\u03b7\u03c2 \u03ba\u03b1\u03b9 \u03b5\u03bd\u03b4\u03ad\u03c7\u03b5\u03c4\u03b1\u03b9 \u03bd\u03b1 \u03c7\u03c1\u03b5\u03b9\u03b1\u03c3\u03c4\u03b5\u03af \u03bb\u03af\u03b3\u03b7 \u03c0\u03b5\u03b6\u03bf\u03c0\u03bf\u03c1\u03af\u03b1, \u03b1\u03bd\u03ac\u03bb\u03bf\u03b3\u03b1 \u03bc\u03b5 \u03c4\u03bf \u03c0\u03bf\u03cd \u03b2\u03c1\u03af\u03c3\u03ba\u03b5\u03c4\u03b1\u03b9 \u03c4\u03bf \u03ba\u03b1\u03c4\u03ac\u03bb\u03c5\u03bc\u03ac \u03c3\u03bf\u03c5.\n\u0391\u03bd \u03c3\u03ba\u03bf\u03c0\u03b5\u03cd\u03b5\u03b9\u03c2 \u03bd\u03b1 \u03c6\u03c4\u03ac\u03c3\u03b5\u03b9\u03c2 \u03bc\u03cc\u03bd\u03bf\u03c2/\u03bc\u03cc\u03bd\u03b7 \u03c3\u03bf\u03c5, \u03bc\u03c0\u03bf\u03c1\u03b5\u03af\u03c2 \u03bd\u03b1 \u03bf\u03b4\u03b7\u03b3\u03ae\u03c3\u03b5\u03b9\u03c2, \u03bd\u03b1 \u03c0\u03ac\u03c1\u03b5\u03b9\u03c2 \u03c4\u03b1\u03be\u03af \u03ae \u03bd\u03b1 \u03c0\u03b1\u03c2 \u03bc\u03b5 \u03c4\u03b1 \u03c0\u03cc\u03b4\u03b9\u03b1, \u03b1\u03bd\u03ac\u03bb\u03bf\u03b3\u03b1 \u03bc\u03b5 \u03c4\u03bf \u03c0\u03bf\u03cd \u03bc\u03ad\u03bd\u03b5\u03b9\u03c2. \u03a0\u03b1\u03c1\u03b1\u03ba\u03b1\u03bb\u03bf\u03cd\u03bc\u03b5 \u03b4\u03ae\u03bb\u03c9\u03c3\u03b5 \u03c4\u03b7\u03bd \u03c0\u03c1\u03bf\u03c4\u03af\u03bc\u03b7\u03c3\u03ae \u03c3\u03bf\u03c5 \u03c3\u03c4\u03b7 \u03c6\u03cc\u03c1\u03bc\u03b1 RSVP."}, {"q": "\u0398\u03b1 \u03b3\u03af\u03bd\u03bf\u03c5\u03bd \u03cc\u03bb\u03b1 \u03c3\u03c4\u03bf\u03bd \u03af\u03b4\u03b9\u03bf \u03c7\u03ce\u03c1\u03bf;", "a": "\u039d\u03b1\u03b9. \u0397 \u03c4\u03b5\u03bb\u03b5\u03c4\u03ae \u03ba\u03b1\u03b9 \u03c4\u03bf \u03c0\u03ac\u03c1\u03c4\u03b9 \u03b8\u03b1 \u03c0\u03c1\u03b1\u03b3\u03bc\u03b1\u03c4\u03bf\u03c0\u03bf\u03b9\u03b7\u03b8\u03bf\u03cd\u03bd \u03c3\u03c4\u03bf\u03bd \u03af\u03b4\u03b9\u03bf \u03c7\u03ce\u03c1\u03bf."}, {"q": "\u03a5\u03c0\u03ac\u03c1\u03c7\u03b5\u03b9 \u03c7\u03ce\u03c1\u03bf\u03c2 \u03c3\u03c4\u03ac\u03b8\u03bc\u03b5\u03c5\u03c3\u03b7\u03c2;", "a": "\u039d\u03b1\u03b9."}, {"q": "\u03a0\u03cc\u03c4\u03b5 \u03c0\u03c1\u03ad\u03c0\u03b5\u03b9 \u03bd\u03b1 \u03c6\u03c4\u03ac\u03c3\u03c9 \u03c3\u03c4\u03bf\u03bd \u03c7\u03ce\u03c1\u03bf;", "a": "\u0391\u03bd \u03c6\u03c4\u03ac\u03c3\u03b5\u03b9\u03c2 \u03bc\u03b5 \u03b4\u03b9\u03ba\u03cc \u03c3\u03bf\u03c5 \u03bc\u03ad\u03c3\u03bf, \u03c0\u03b1\u03c1\u03b1\u03ba\u03b1\u03bb\u03bf\u03cd\u03bc\u03b5 \u03bd\u03b1 \u03b2\u03c1\u03af\u03c3\u03ba\u03b5\u03c3\u03b1\u03b9 \u03c3\u03c4\u03bf \u03b5\u03c3\u03c4\u03b9\u03b1\u03c4\u03cc\u03c1\u03b9\u03bf \u03c3\u03c4\u03b9\u03c2 5\u03bc\u03bc. \u0388\u03c7\u03bf\u03c5\u03bc\u03b5 \u03c5\u03c0\u03bf\u03bb\u03bf\u03b3\u03af\u03c3\u03b5\u03b9 \u03b1\u03c1\u03ba\u03b5\u03c4\u03cc \u03c7\u03c1\u03cc\u03bd\u03bf \u03ce\u03c3\u03c4\u03b5 \u03bd\u03b1 \u03c4\u03b1\u03ba\u03c4\u03bf\u03c0\u03bf\u03b9\u03b7\u03b8\u03b5\u03af\u03c2 \u03c0\u03c1\u03b9\u03bd \u03be\u03b5\u03ba\u03b9\u03bd\u03ae\u03c3\u03b5\u03b9 \u03b7 \u03c4\u03b5\u03bb\u03b5\u03c4\u03ae. \u0391\u03bd \u03c6\u03c4\u03ac\u03c3\u03b5\u03b9\u03c2 \u03b1\u03c1\u03b3\u03cc\u03c4\u03b5\u03c1\u03b1 \u03ba\u03b1\u03b9 \u03b7 \u03c4\u03b5\u03bb\u03b5\u03c4\u03ae \u03ad\u03c7\u03b5\u03b9 \u03ae\u03b4\u03b7 \u03be\u03b5\u03ba\u03b9\u03bd\u03ae\u03c3\u03b5\u03b9, \u03c0\u03b1\u03c1\u03b1\u03ba\u03b1\u03bb\u03bf\u03cd\u03bc\u03b5 \u03b1\u03ba\u03bf\u03bb\u03bf\u03cd\u03b8\u03b7\u03c3\u03b5 \u03c4\u03b9\u03c2 \u03bf\u03b4\u03b7\u03b3\u03af\u03b5\u03c2 \u03c4\u03bf\u03c5 \u03c0\u03c1\u03bf\u03c3\u03c9\u03c0\u03b9\u03ba\u03bf\u03cd."}, {"q": "\u039f \u03b3\u03ac\u03bc\u03bf\u03c2 \u03b8\u03b1 \u03b3\u03af\u03bd\u03b5\u03b9 \u03c3\u03b5 \u03b5\u03c3\u03c9\u03c4\u03b5\u03c1\u03b9\u03ba\u03cc \u03ae \u03b5\u03be\u03c9\u03c4\u03b5\u03c1\u03b9\u03ba\u03cc \u03c7\u03ce\u03c1\u03bf;", "a": "\u038c\u03bb\u03b1 \u03b8\u03b1 \u03c0\u03c1\u03b1\u03b3\u03bc\u03b1\u03c4\u03bf\u03c0\u03bf\u03b9\u03b7\u03b8\u03bf\u03cd\u03bd \u03c3\u03b5 \u03b5\u03be\u03c9\u03c4\u03b5\u03c1\u03b9\u03ba\u03cc \u03c7\u03ce\u03c1\u03bf."}, {"q": "\u03a5\u03c0\u03ac\u03c1\u03c7\u03bf\u03c5\u03bd \u03b3\u03b1\u03bc\u03ae\u03bb\u03b9\u03b1 \u03ad\u03b8\u03b9\u03bc\u03b1 \u03c0\u03bf\u03c5 \u03c0\u03c1\u03ad\u03c0\u03b5\u03b9 \u03bd\u03b1 \u03b3\u03bd\u03c9\u03c1\u03af\u03b6\u03c9;", "a": "\u03a0\u03c1\u03bf\u03c2 \u03c4\u03bf \u03c0\u03b1\u03c1\u03cc\u03bd \u03cc\u03c7\u03b9. \u0398\u03b1 \u03c3\u03bf\u03c5 \u03b4\u03ce\u03c3\u03bf\u03c5\u03bc\u03b5 \u03cc\u03bb\u03b5\u03c2 \u03c4\u03b9\u03c2 \u03b1\u03c0\u03b1\u03c1\u03b1\u03af\u03c4\u03b7\u03c4\u03b5\u03c2 \u03c0\u03bb\u03b7\u03c1\u03bf\u03c6\u03bf\u03c1\u03af\u03b5\u03c2 \u03c4\u03b7\u03bd \u03ba\u03b1\u03c4\u03ac\u03bb\u03bb\u03b7\u03bb\u03b7 \u03c3\u03c4\u03b9\u03b3\u03bc\u03ae."}, {"q": "\u03a5\u03c0\u03ac\u03c1\u03c7\u03bf\u03c5\u03bd \u03ba\u03b1\u03c1\u03ad\u03ba\u03bb\u03b5\u03c2 \u03b3\u03b9\u03b1 \u03bc\u03b9\u03ba\u03c1\u03ac \u03c0\u03b1\u03b9\u03b4\u03b9\u03ac;", "a": "\u03a4\u03bf \u03b5\u03c3\u03c4\u03b9\u03b1\u03c4\u03cc\u03c1\u03b9\u03bf \u03b4\u03b9\u03b1\u03b8\u03ad\u03c4\u03b5\u03b9 2 \u03c0\u03b1\u03b9\u03b4\u03b9\u03ba\u03ac \u03ba\u03b1\u03b8\u03af\u03c3\u03bc\u03b1\u03c4\u03b1. \u03a4\u03b1 \u03c0\u03b1\u03b9\u03b4\u03b9\u03ac \u03ba\u03ac\u03c4\u03c9 \u03c4\u03c9\u03bd 2 \u03b5\u03c4\u03ce\u03bd \u03b4\u03b5\u03bd \u03c0\u03b5\u03c1\u03b9\u03bb\u03b1\u03bc\u03b2\u03ac\u03bd\u03bf\u03bd\u03c4\u03b1\u03b9 \u03c3\u03c4\u03bf \u03c0\u03bb\u03ac\u03bd\u03bf \u03ba\u03b1\u03b8\u03b9\u03c3\u03bc\u03ac\u03c4\u03c9\u03bd \u03bc\u03b1\u03c2. \u03a0\u03b1\u03c1\u03b1\u03ba\u03b1\u03bb\u03bf\u03cd\u03bc\u03b5 \u03b5\u03bd\u03b7\u03bc\u03ad\u03c1\u03c9\u03c3\u03ad \u03bc\u03b1\u03c2 \u03c3\u03c4\u03b7 \u03c6\u03cc\u03c1\u03bc\u03b1 RSVP \u03b1\u03bd \u03c7\u03c1\u03b5\u03b9\u03ac\u03b6\u03b5\u03c3\u03b1\u03b9 \u03bc\u03b9\u03b1 \u03ba\u03b1\u03b8\u03bf\u03c1\u03b9\u03c3\u03bc\u03ad\u03bd\u03b7 \u03b8\u03ad\u03c3\u03b7 \u03b4\u03af\u03c0\u03bb\u03b1 \u03c3\u03bf\u03c5 \u03b3\u03b9\u03b1 \u03c4\u03bf \u03bc\u03b9\u03ba\u03c1\u03cc \u03c3\u03bf\u03c5 \u03c0\u03b1\u03b9\u03b4\u03af."}, {"section": "\u0393\u03b5\u03bd\u03b9\u03ba\u03ac", "q": "\u03a7\u03c1\u03b5\u03b9\u03ac\u03b6\u03b5\u03c4\u03b1\u03b9 \u03bd\u03b1 \u03bc\u03ac\u03b8\u03c9 \u03b3\u03b5\u03c1\u03bc\u03b1\u03bd\u03b9\u03ba\u03ac \u03b3\u03b9\u03b1 \u03bd\u03b1 \u03c0\u03b1\u03c1\u03b5\u03c5\u03c1\u03b5\u03b8\u03ce \u03c3\u03c4\u03bf\u03bd \u03b3\u03ac\u03bc\u03bf;", "a": "\u038c\u03c7\u03b9, \u03b1\u03bb\u03bb\u03ac \u03b8\u03b1 \u03ae\u03c4\u03b1\u03bd \u03b5\u03bd\u03c4\u03c5\u03c0\u03c9\u03c3\u03b9\u03b1\u03ba\u03cc \u03b1\u03bd \u03c4\u03bf \u03ad\u03ba\u03b1\u03bd\u03b5\u03c2! \u039f \u03b3\u03ac\u03bc\u03bf\u03c2 \u03bc\u03b1\u03c2 \u03b8\u03b1 \u03b3\u03af\u03bd\u03b5\u03b9 \u03c3\u03c4\u03b1 \u03b5\u03bb\u03bb\u03b7\u03bd\u03b9\u03ba\u03ac \u03ba\u03b1\u03b9 \u03c3\u03c4\u03b1 \u03b3\u03b5\u03c1\u03bc\u03b1\u03bd\u03b9\u03ba\u03ac."}, {"q": "\u03a4\u03b9 \u03b3\u03af\u03bd\u03b5\u03c4\u03b1\u03b9 \u03b1\u03bd \u03b8\u03ad\u03bb\u03c9 \u03bd\u03b1 \u03c3\u03b1\u03c2 \u03ba\u03ac\u03bd\u03c9 \u03b4\u03ce\u03c1\u03bf;", "a": "\u0395\u03af\u03bd\u03b1\u03b9 \u03c0\u03bf\u03bb\u03cd \u03b5\u03c5\u03b3\u03b5\u03bd\u03b9\u03ba\u03cc \u03b5\u03ba \u03bc\u03ad\u03c1\u03bf\u03c5\u03c2 \u03c3\u03bf\u03c5! \u0388\u03bd\u03b1 \u03c7\u03c1\u03b7\u03bc\u03b1\u03c4\u03b9\u03ba\u03cc \u03b4\u03ce\u03c1\u03bf \u03b5\u03af\u03bd\u03b1\u03b9 \u03c4\u03bf \u03c0\u03b9\u03bf \u03b5\u03cd\u03ba\u03bf\u03bb\u03bf \u03bd\u03b1 \u03c7\u03c9\u03c1\u03ad\u03c3\u03b5\u03b9 \u03c3\u03c4\u03b9\u03c2 \u03c7\u03b5\u03b9\u03c1\u03b1\u03c0\u03bf\u03c3\u03ba\u03b5\u03c5\u03ad\u03c2 \u03bc\u03b1\u03c2."}, {"q": "\u03a0\u03ce\u03c2 \u03b3\u03bd\u03c9\u03c1\u03b9\u03c3\u03c4\u03ae\u03ba\u03b1\u03c4\u03b5;", "a": "\u00ab\u0391\u03c0\u03bb\u03ce\u03c2 \u03bc\u03b5\u03c4\u03b1\u03ba\u03cc\u03bc\u03b9\u03c3\u03b5 \u03bc\u03b1\u03b6\u03af \u03bc\u03bf\u03c5.\u00bb \u2013 Sebastiano"}, {"q": "\u0388\u03c7\u03c9 \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03b5\u03c1\u03c9\u03c4\u03ae\u03c3\u03b5\u03b9\u03c2. \u03a4\u03b9 \u03bd\u03b1 \u03ba\u03ac\u03bd\u03c9;", "a": "\u039c\u03c0\u03bf\u03c1\u03b5\u03af\u03c2 \u03b 03c3\u03c4\u03b9\u03b3\u03bc\u03ae. \u0394\u03bf\u03ba\u03b9\u03bc\u03ac\u03c3\u03c4\u03b5 \u03be\u03b1\u03bd\u03ac \u03b1\u03c1\u03b3\u03cc\u03c4\u03b5\u03c1\u03b1.", "bad_code": "\u0395\u03b9\u03c3\u03b1\u03b3\u03ac\u03b3\u03b5\u03c4\u03b5 \u03c4\u03bf\u03bd \u03ba\u03bf\u03b9\u03bd\u03cc \u03ba\u03c9\u03b4\u03b9\u03ba\u03cc \u03c0\u03c1\u03cc\u03c3\u03b2\u03b1\u03c3\u03b7\u03c2.", "bad_password": "\u039f \u03ba\u03c9\u03b4\u03b9\u03ba\u03cc\u03c2 \u03c0\u03c1\u03cc\u03c3\u03b2\u03b1\u03c3\u03b7\u03c2 \u03b4\u03b5\u03bd \u03b5\u03af\u03bd\u03b1\u03b9 \u03c3\u03c9\u03c3\u03c4\u03cc\u03c2. \u0394\u03bf\u03ba\u03b9\u03bc\u03ac\u03c3\u03c4\u03b5 \u03be\u03b1\u03bd\u03ac.", "loading": "\u0386\u03bd\u03bf\u03b9\u03b3\u03bc\u03b1 RSVP\u2026", "unconfigured": "\u0397 \u03c6\u03cc\u03c1\u03bc\u03b1 RSVP \u03b8\u03b1 \u03b1\u03bd\u03bf\u03af\u03be\u03b5\u03b9 \u03bc\u03cc\u03bb\u03b9\u03c2 \u03b5\u03af\u03bd\u03b1\u03b9 \u03ad\u03c4\u03bf\u03b9\u03bc\u03b7 \u03b7 \u03b9\u03b4\u03b9\u03c9\u03c4\u03b9\u03ba\u03ae \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1.", "entry_note": "\u039f \u03ba\u03c9\u03b4\u03b9\u03ba\u03cc\u03c2 \u03c0\u03c1\u03cc\u03c3\u03b2\u03b1\u03c3\u03b7\u03c2 \u03b1\u03bd\u03b1\u03b3\u03c1\u03ac\u03c6\u03b5\u03c4\u03b1\u03b9 \u03c3\u03c4\u03b7\u03bd \u03c0\u03c1\u03cc\u03c3\u03ba\u03bb\u03b7\u03c3\u03ae \u03c3\u03b1\u03c2. \u0397 \u03b1\u03c0\u03ac\u03bd\u03c4\u03b7\u03c3\u03ae \u03c3\u03b1\u03c2 \u03c0\u03b1\u03c1\u03b1\u03bc\u03ad\u03bd\u03b5\u03b9 \u03b9\u03b4\u03b9\u03c9\u03c4\u03b9\u03ba\u03ae."}, "travel_pages": {"itineraries": {"intro": "\u03a0\u03c1\u03bf\u03c4\u03b5\u03b9\u03bd\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2 \u03b4\u03b9\u03b1\u03b4\u03c1\u03bf\u03bc\u03ad\u03c2 \u03ba\u03b1\u03b9 \u03b4\u03b9\u03ac\u03c1\u03ba\u03b5\u03b9\u03b1 \u03c4\u03b1\u03be\u03b9\u03b4\u03b9\u03ce\u03bd.", "sections": []}, "sitia": {"intro": "\u039f \u03c4\u03bf\u03c0\u03b9\u03ba\u03cc\u03c2 \u03bc\u03b1\u03c2 \u03bf\u03b4\u03b7\u03b3\u03cc\u03c2 \u03b3\u03b9\u03b1 u03c4\u03b7\u03bd \u03c0\u03b1\u03c1\u03b1\u03bb\u03af\u03b1 \u03c4\u03b7\u03c2 \u03a7\u03b9\u03cc\u03bd\u03b1\u03c2.", "\u03a4\u03bf Fotis Seaside \u03b5\u03af\u03bd\u03b1\u03b9 \u03b5\u03c3\u03c4\u03b9\u03b1\u03c4\u03cc\u03c1\u03b9\u03bf, \u03ba\u03b1\u03c6\u03ad \u03ba\u03b1\u03b9 \u03bc\u03c0\u03b1\u03c1 \u03b1\u03ba\u03c1\u03b9\u03b2\u03ce\u03c2 \u03b4\u03af\u03c0\u03bb\u03b1 \u03c3\u03c4\u03b7 \u03b8\u03ac\u03bb\u03b1\u03c3\u03c3\u03b1, \u03ba\u03bf\u03bd\u03c4\u03ac \u03c3\u03c4\u03bf \u03a0\u03b1\u03bb\u03b1\u03af\u03ba\u03b1\u03c3\u03c4\u03c1\u03bf. \u0397 \u03ba\u03bf\u03c5\u03b6\u03af\u03bd\u03b1 \u03b5\u03b9\u03b4\u03b9\u03ba\u03b5\u03cd\u03b5\u03c4\u03b1\u03b9 \u03c3\u03c4\u03b1 \u03c6\u03c1\u03ad\u03c3\u03ba\u03b1 \u03b8\u03b1\u03bb\u03b1\u03c3\u03c3\u03b9\u03bd\u03ac \u03b1\u03c0\u03cc \u03bd\u03c4\u03cc\u03c0\u03b9\u03bf\u03c5\u03c2 \u03c8\u03b1\u03c1\u03ac\u03b4\u03b5\u03c2 \u03ba\u03b1\u03b9 \u03c0\u03c1\u03bf\u03c3\u03c6\u03ad\u03c1\u03b5\u03b9 \u03b5\u03c0\u03af\u03c3\u03b7\u03c2 \u03ba\u03c1\u03b7\u03c4\u03b9\u03ba\u03ac \u03ba\u03b1\u03b9 \u03bc\u03b5\u03c3\u03bf\u03b3\u03b5\u03b9\u03b1\u03ba\u03ac \u03c0\u03b9\u03ac\u03c4\u03b1, \u03ba\u03c1\u03ad\u03b1\u03c2, \u03c3\u03b1\u03bb\u03ac\u03c4\u03b5\u03c2, \u03b5\u03c0\u03b9\u03b4\u03cc\u03c1\u03c0\u03b9\u03b1 \u03ba\u03b1\u03b9 \u03b5\u03c0\u03b9\u03bb\u03b5\u03b3\u03bc\u03ad\u03bd\u03b7 \u03bb\u03af\u03c3\u03c4\u03b1 \u03ba\u03c1\u03b1\u03c3\u03b9\u03ce\u03bd. \u03a3\u03c4\u03b7\u03bd \u03c0\u03b1\u03c1\u03b1\u03bb\u03af\u03b1 \u03c3\u03b5\u03c1\u03b2\u03af\u03c1\u03bf\u03bd\u03c4\u03b1\u03b9 \u03b5\u03c0\u03af\u03c3\u03b7\u03c2 \u03ba\u03b1\u03c6\u03ad\u03c2, \u03ba\u03bf\u03ba\u03c4\u03ad\u03b9\u03bb \u03ba\u03b1\u03b9 \u03c3\u03bd\u03b1\u03ba.", "\u03a4\u03bf \u03b1\u03ba\u03c1\u03b9\u03b2\u03ad\u03c2 \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1 \u03ba\u03b1\u03b9 \u03bf\u03b9 \u03c0\u03bb\u03b7\u03c1\u03bf\u03c6\u03bf\u03c1\u03af\u03b5\u03c2 \u03b3\u03b9\u03b1 \u03c4\u03bf\u03c5\u
